name: Vita
options:
  bundleIdPrefix: com.leonardo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 真机签名：个人免费团队，自动签名（装到设备上的 App 7 天后需重装）。
    DEVELOPMENT_TEAM: 7Z55C6T77Z
    CODE_SIGN_STYLE: Automatic
    # 版本号规则见 ADR-023：主版本 = 产品代际，次版本 = 一个里程碑或一批新功能，修订 = 只修 bug；
    # 和那批改动放在同一个提交里，装手机前改好。构建号与提交由下面的构建脚本在每次构建时写入（见 Vita 目标的 postBuildScripts）。
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vita:
    type: application
    platform: iOS
    sources:
      - path: Vita
        excludes:
          - Info.plist
          - Vita.entitlements
      # 公共营养参考库构建产物（reference-foods.json，Git 忽略）；不存在时 App 以空库运行。
      - path: Resources/ReferenceFood
        excludes:
          - "*.md"
    entitlements:
      path: Vita/Vita.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardo.vita
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHealthShareUsageDescription: Vita 读取身高、体重、体脂率、出生日期、性别、睡眠和活动能量，用来生成每日目标并展示健康数据。
        INFOPLIST_KEY_NSCameraUsageDescription: Vita 用相机拍营养成分表，照片传到你的 Vita 服务并发给模型读出营养数值，帮你存进个人食品库。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Vita 把你确认过的饮食记录（能量、蛋白质、脂肪、碳水），以及体脂秤称出的体重、体脂率和去脂体重写入 Apple 健康。
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Vita 用蓝牙连接阿福体脂秤，读取体重和体脂测量结果。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Vita/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vita
        # 迁移到 2.0 时的导出文件放在“文稿”目录，在“文件”App 里能看到、能拷走（架构设计 §13）。
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # 构建脚本要读 git，不能在脚本沙盒里跑。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      # Vita API 与远程配置的地址只由构建配置决定，不可远程修改（vita-admin.md §3.2 / §7、架构设计 §5）。
      # 目前只有一个实例；有了开发实例后把 Debug 指过去。
      configs:
        Debug:
          VITA_API_BASE_URL: https://vita-api.r4s.leonardo-zhu.me
          REMOTE_CONFIG_URL: https://vita.r4s.leonardo-zhu.me/config/stable.json
          DIAGNOSTICS_URL: https://vita.r4s.leonardo-zhu.me/api/ingest/events
        Release:
          VITA_API_BASE_URL: https://vita-api.r4s.leonardo-zhu.me
          REMOTE_CONFIG_URL: https://vita.r4s.leonardo-zhu.me/config/stable.json
          DIAGNOSTICS_URL: https://vita.r4s.leonardo-zhu.me/api/ingest/events
    # 每次构建把构建号（提交数）和提交写进 Info.plist，设置页显示，装到手机上能看出是不是最新的。
    # 有未提交的改动时提交后面加 +。
    postBuildScripts:
      - name: Stamp build number and commit
        basedOnDependencyAnalysis: false
        # 以生成好的 Info.plist 为输入，构建系统才会排在 Info.plist 处理之后、签名之前。
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          count=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo 0)
          commit=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "${SRCROOT}/.." status --porcelain -- ios shared 2>/dev/null)" ]; then commit="${commit}+"; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${count}" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :VitaGitCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :VitaGitCommit string ${commit}" "$plist"
  VitaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VitaTests
      # 诊断上报的示例批次，与 Admin 的校验测试共用
      - path: ../shared/diagnostics/example-batch.json
        buildPhase: resources
    dependencies:
      - target: Vita
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardo.vita.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vita:
    build:
      targets:
        Vita: all
    test:
      targets:
        - VitaTests
