name: Vita
options:
  bundleIdPrefix: com.leonardo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vita:
    type: application
    platform: iOS
    sources:
      - path: Vita
        excludes:
          - Info.plist
      # 公共营养参考库构建产物（reference-foods.json，Git 忽略）；不存在时 App 以空库运行。
      - path: Resources/ReferenceFood
        excludes:
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardo.vita
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Vita/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vita
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
      # Conduit 地址只由构建配置决定，不可远程修改（vita-admin.md §3.2）。
      # 目前只有一个实例；有了开发实例后把 Debug 指过去。
      configs:
        Debug:
          CONDUIT_BASE_URL: https://conduit.r4s.leonardo-zhu.me
        Release:
          CONDUIT_BASE_URL: https://conduit.r4s.leonardo-zhu.me
  VitaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VitaTests
    dependencies:
      - target: Vita
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardo.vita.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vita:
    build:
      targets:
        Vita: all
    test:
      targets:
        - VitaTests
