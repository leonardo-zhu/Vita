name: Vita
options:
  bundleIdPrefix: com.leonardo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 真机签名：个人免费团队，自动签名（装到设备上的 App 7 天后需重装）。
    DEVELOPMENT_TEAM: 7Z55C6T77Z
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vita:
    type: application
    platform: iOS
    sources:
      - path: Vita
        excludes:
          - Info.plist
          - Vita.entitlements
      # 公共营养参考库构建产物（reference-foods.json，Git 忽略）；不存在时 App 以空库运行。
      - path: Resources/ReferenceFood
        excludes:
          - "*.md"
    entitlements:
      path: Vita/Vita.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardo.vita
        INFOPLIST_KEY_NSHealthShareUsageDescription: Vita 读取身高、体重、体脂率、出生日期、性别、睡眠和活动能量，用来生成每日目标并展示健康数据。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Vita 把你确认过的饮食记录（能量、蛋白质、脂肪、碳水）写入 Apple 健康。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Vita/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vita
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
      # Conduit 地址只由构建配置决定，不可远程修改（vita-admin.md §3.2）。
      # 目前只有一个实例；有了开发实例后把 Debug 指过去。
      configs:
        Debug:
          CONDUIT_BASE_URL: https://conduit.r4s.leonardo-zhu.me
        Release:
          CONDUIT_BASE_URL: https://conduit.r4s.leonardo-zhu.me
  VitaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VitaTests
    dependencies:
      - target: Vita
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonardo.vita.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vita:
    build:
      targets:
        Vita: all
    test:
      targets:
        - VitaTests
